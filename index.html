// --- КЭШ СПРАЙТОВ (рисуем 1 раз в offscreen, потом blit) ---
const spriteCache = {};
function buildSprite(key, matrix, palette) {
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    const cx = c.getContext('2d');
    for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
            const v = matrix[y][x];
            const col = palette[v];
            if (col) {
                cx.fillStyle = col;
                cx.fillRect(x, y, 1, 1);
            }
        }
    }
    spriteCache[key] = c;
}
buildSprite('player', SPR.player, PAL.player);
buildSprite('enemy', SPR.enemy, PAL.enemy);
buildSprite('hiding', SPR.hiding, PAL.hiding);
buildSprite('candy', SPR.candy, PAL.candy);

// --- ВВОД ---
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- КЛАСС: ИГРОК ---
class Player {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 32;
        this.vx = 0; this.vy = 0;
        this.onGround = false;
        this.facing = 1; // 1 вправо, -1 влево
        this.hidden = false;
        this.alive = true;
    }
    update(dt, platforms, hidingSpots) {
        // Горизонтальное движение
        let moving = false;
        if (keys['ArrowLeft'] || keys['KeyA']) { this.vx = -PLAYER_SPEED; this.facing = -1; moving = true; }
        else if (keys['ArrowRight'] || keys['KeyD']) { this.vx = PLAYER_SPEED; this.facing = 1; moving = true; }
        else this.vx = 0;

        // Прыжок
        if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && this.onGround) {
            this.vy = JUMP_POWER;
            this.onGround = false;
        }

        // Гравитация
        this.vy += GRAVITY * dt;
        if (this.vy > MAX_FALL) this.vy = MAX_FALL;

        // Движение по X с коллизией
        this.x += this.vx * dt;
        this.resolveCollisionsX(platforms);

        // Движение по Y с коллизией
        this.y += this.vy * dt;
        this.onGround = false;
        this.resolveCollisionsY(platforms);

        // Проверка, прячется ли игрок
        this.hidden = false;
        for (const h of hidingSpots) {
            if (this.overlaps(h)) { this.hidden = true; break; }
        }

        // Падение в бездну
        if (this.y > CANVAS_H + 200) this.alive = false;
    }
    resolveCollisionsX(platforms) {
        for (const p of platforms) {
            if (this.overlaps(p)) {
                if (this.vx > 0) this.x = p.x - this.w;
                else if (this.vx < 0) this.x = p.x + p.w;
                this.vx = 0;
            }
        }
    }
    resolveCollisionsY(platforms) {
        for (const p of platforms) {
            if (this.overlaps(p)) {
                if (this.vy > 0) {
                    this.y = p.y - this.h;
                    this.vy = 0;
                    this.onGround = true;
                } else if (this.vy < 0) {
                    this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        }
    }
    overlaps(o) {
        return this.x < o.x + o.w && this.x + this.w > o.x &&
               this.y < o.y + o.h && this.y + this.h > o.y;
    }
    draw(ctx, cam) {
        const sx = this.x - cam.x;
        const sy = this.y - cam.y;
        ctx.save();
        if (this.hidden) ctx.globalAlpha = 0.4;
        if (this.facing === -1) {
            ctx.translate(sx + this.w, sy);
            ctx.scale(-1, 1);
            ctx.drawImage(spriteCache.player, 0, 0, this.w, this.h);
        } else {
            ctx.drawImage(spriteCache.player, sx, sy, this.w, this.h);
        }
        ctx.restore();
    }
}

// --- КЛАСС: ВРАГ ---
class Enemy {
    constructor(x, y, patrolRange, speed) {
        this.x = x; this.y = y;
        this.w = 28; this.h = 32;
        this.startX = x;
        this.patrolRange = patrolRange;
        this.speed = speed || 1;
        this.dir = 1;
        this.visionDist = 140;
        this.visionAngle = 50; // градусов в каждую сторону
        this.alertTimer = 0;
    }
    update(dt, player, platforms, hidingSpots) {
        // Патрулирование
        this.x += this.dir * this.speed * dt;
        if (this.x > this.startX + this.patrolRange) this.dir = -1;
        if (this.x < this.startX - this.patrolRange) this.dir = 1;

        // Проверка видимости игрока
        if (player.alive && !player.hidden && this.canSee(player, platforms, hidingSpots)) {
            this.alertTimer += dt;
            if (this.alertTimer > 40) {
                player.alive = false; // Обнаружен!
            }
        } else {
            this.alertTimer = Math.max(0, this.alertTimer - dt * 0.5);
        }
    }
    canSee(player, platforms, hidingSpots) {
        const cx = this.x + this.w / 2;
        const cy = this.y + this.h / 2;
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const dx = px - cx;
        const dy = py - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > this.visionDist) return false;

        // Проверка направления (враг смотрит в сторону движения)
        const angleToPlayer = Math.atan2(dy, dx * this.dir) * 180 / Math.PI;
        if (Math.abs(angleToPlayer) > this.visionAngle) return false;

        // Проверка препятствий (raycast)
        const steps = Math.ceil(dist / 4);
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const rx = cx + dx * t;
            const ry = cy + dy * t;
            for (const p of platforms) {
                if (rx > p.x && rx < p.x + p.w && ry > p.y && ry < p.y + p.h) return false;
            }
        }
        return true;
    }
    draw(ctx, cam) {
        const sx = this.x - cam.x;
        const sy = this.y - cam.y;

        // Конус зрения
        ctx.save();
        const cx = sx + this.w / 2;
        const cy = sy + this.h / 2;
        const baseAngle = this.dir === 1 ? 0 : Math.PI;
        const a1 = baseAngle - (this.visionAngle * Math.PI / 180);
        const a2 = baseAngle + (this.visionAngle * Math.PI / 180);

        const alert = this.alertTimer / 40;
        ctx.fillStyle = `rgba(255, ${Math.floor(100 - alert * 100)}, 0, ${0.2 + alert * 0.3})`;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, this.visionDist, a1, a2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // Сам враг
        ctx.save();
        if (this.dir === -1) {
            ctx.translate(sx + this.w, sy);
            ctx.scale(-1, 1);
            ctx.drawImage(spriteCache.enemy, 0, 0, this.w, this.h);
        } else {
            ctx.drawImage(spriteCache.enemy, sx, sy, this.w, this.h);
        }
        ctx.restore();

        // Индикатор тревоги
        if (this.alertTimer > 10) {
            ctx.fillStyle = '#FF0000';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('!', sx + this.w / 2 - 4, sy - 5);
        }
    }
}

// --- КЛАСС: КОНФЕТА ---
class Candy {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 20; this.h = 20;
        this.collected = false;
        this.bob = Math.random() * Math.PI * 2;
    }
    update(dt) {
        this.bob += 0.05 * dt;
    }
    draw(ctx, cam) {
        if (this.collected) return;
        const sx = this.x - cam.x;
        const sy = this.y - cam.y + Math.sin(this.bob) * 3;
        ctx.drawImage(spriteCache.candy, sx, sy, this.w, this.h);
    }
}

// --- КЛАСС: ПЛАТФОРМА ---
class Platform {
    constructor(x, y, w, h) {
        this.x = x; this.y = y;
        this.w = w; this.h = h;
    }
    draw(ctx, cam) {
        const sx = this.x - cam.x;
        const sy = this.y - cam.y;
        // Шоколадная плитка с узором
        ctx.fillStyle = '#5C2E0E';
        ctx.fillRect(sx, sy, this.w, this.h);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(sx, sy, this.w, 4);
        ctx.fillStyle = '#3E1F0F';
        ctx.fillRect(sx, sy + this.h - 4, this.w, 4);
        // Квадратики шоколада
        ctx.fillStyle = '#3E1F0F';
        const tileW = 32;
        for (let i = 0; i < this.w; i += tileW) {
            ctx.fillRect(sx + i, sy, 2, this.h);
        }
    }
}

// --- КЛАСС: УКРЫТИЕ ---
class HidingSpot {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 32; this.h = 32;
    }
    draw(ctx, cam) {
        const sx = this.x - cam.x;
        const sy = this.y - cam.y;
        ctx.drawImage(spriteCache.hiding, sx, sy, this.w, this.h);
    }
}

// --- КЛАСС: ФИНИШ ---
class Finish {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 40; this.h = 80;
    }
    draw(ctx, cam) {
        const sx = this.x - cam.x;
        const sy = this.y - cam.y;
        // Giant lollipop
        ctx.fillStyle = '#FFF';
        ctx.fillRect(sx + 16, sy + 30, 8, 50);
        ctx.fillStyle = '#FF1493';
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 20, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 20, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FF1493';
        ctx.beginPath();
        ctx.arc(sx + 20, sy + 20, 6, 0, Math.PI * 2);
        ctx.fill();
        // Флаг
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('FINISH', sx - 5, sy - 5);
    }
}

// --- ГЕНЕРАТОР УРОВНЕЙ ---
class LevelGenerator {
    constructor(level) {
        this.level = level;
        this.platforms = [];
        this.enemies = [];
        this.candies = [];
        this.hidingSpots = [];
        this.finish = null;
        this.length = 0;
        this.generate();
    }
    generate() {
        // Длина уровня зависит от уровня
        const totalLength = 2500 + this.level * 1000;

        // Стартовая платформа (всегда ровная)
        this.platforms.push(new Platform(0, GROUND_Y, 600, 100));

        // Обучалка на уровне 1
        if (this.level === 1) {
            this.platforms.push(new Platform(700, GROUND_Y, 400, 100));
            this.candies.push(new Candy(850, GROUND_Y - 40));
            this.platforms.push(new Platform(1200, GROUND_Y, 400, 100));
            this.candies.push(new Candy(1350, GROUND_Y - 40));
            this.platforms.push(new Platform(1700, GROUND_Y, 800, 100));
            this.length = 2500;
            this.finish = new Finish(2400, GROUND_Y - 80);
            return;
        }

        let curX = 600;
        let chunkIndex = 0;
        const chunkTypes = this.getChunkTypes();

        while (curX < totalLength - 1000) {
            const type = chunkTypes[Math.floor(Math.random() * chunkTypes.length)];
            this.buildChunk(type, curX);
            curX += 600 + Math.random() * 200;
            chunkIndex++;
        }

        // Финишная платформа
        this.platforms.push(new Platform(curX, GROUND_Y, 600, 100));
        this.length = curX + 600;
        this.finish = new Finish(curX + 500, GROUND_Y - 80);
    }
    getChunkTypes() {
        // Чем выше уровень, тем больше типов
        if (this.level === 2) return ['gap', 'enemy_simple'];
        if (this.level === 3) return ['gap', 'enemy_simple', 'stairs', 'enemy_hide'];
        if (this.level === 4) return ['gap', 'stairs', 'enemy_hide', 'enemy_double', 'pit'];
        return ['gap', 'stairs', 'enemy_hide', 'enemy_double', 'pit', 'gauntlet'];
    }
    buildChunk(type, startX) {
        switch (type) {
            case 'gap':
                this.platforms.push(new Platform(startX, GROUND_Y, 250, 100));
                this.platforms.push(new Platform(startX + 400, GROUND_Y, 250, 100));
                this.candies.push(new Candy(startX + 310, GROUND_Y - 50));
                break;
            case 'stairs':
                this.platforms.push(new Platform(startX, GROUND_Y, 200, 100));
                this.platforms.push(new Platform(startX + 250, GROUND_Y - 80, 150, 20));
                this.platforms.push(new Platform(startX + 450, GROUND_Y - 160, 200, 20));
                this.candies.push(new Candy(startX + 500, GROUND_Y - 200));
                this.platforms.push(new Platform(startX + 700, GROUND_Y, 200, 100));
                break;
            case 'enemy_simple':
                this.platforms.push(new Platform(startX, GROUND_Y, 700, 100));
                this.enemies.push(new Enemy(startX + 200, GROUND_Y - 32, 150, 1));
                this.candies.push(new Candy(startX + 600, GROUND_Y - 40));
                break;
            case 'enemy_hide':
                this.platforms.push(new Platform(startX, GROUND_Y, 700, 100));
                this.hidingSpots.push(new HidingSpot(startX + 150, GROUND_Y - 32));
                this.enemies.push(new Enemy(startX + 400, GROUND_Y - 32, 180, 1.2));
                this.candies.push(new Candy(startX + 600, GROUND_Y - 40));
                break;
            case 'enemy_double':
                this.platforms.push(new Platform(startX, GROUND_Y, 800, 100));
                this.hidingSpots.push(new HidingSpot(startX + 100, GROUND_Y - 32));
                this.hidingSpots.push(new HidingSpot(startX + 500, GROUND_Y - 32));
                this.enemies.push(new Enemy(startX + 250, GROUND_Y - 32, 120, 1.3));
                this.enemies.push(new Enemy(startX + 600, GROUND_Y - 32, 100, 1.5));
                this.candies.push(new Candy(startX + 350, GROUND_Y - 40));
                break;
            case 'pit':
                this.platforms.push(new Platform(startX, GROUND_Y, 150, 100));
                this.platforms.push(new Platform(startX + 250, GROUND_Y - 30, 100, 20));
                this.platforms.push(new Platform(startX + 450, GROUND_Y - 60, 100, 20));
                this.platforms.push(new Platform(startX + 650, GROUND_Y, 150, 100));
                this.candies.push(new Candy(startX + 280, GROUND_Y - 70));
                break;
            case 'gauntlet':
                this.platforms.push(new Platform(startX, GROUND_Y, 900, 100));
                this.hidingSpots.push(new HidingSpot(startX + 100, GROUND_Y - 32));
                this.hidingSpots.push(new HidingSpot(startX + 400, GROUND_Y - 32));
                this.hidingSpots.push(new HidingSpot(startX + 700, GROUND_Y - 32));
                this.enemies.push(new Enemy(startX + 250, GROUND_Y - 32, 100, 1.5));
                this.enemies.push(new Enemy(startX + 550, GROUND_Y - 32, 100, 1.5));
                this.candies.push(new Candy(startX + 820, GROUND_Y - 40));
                break;
        }
    }
}

// --- КАМЕРА ---
class Camera {
    constructor() { this.x = 0; this.y = 0; }
    follow(target, levelLength) {
        const targetX = target.x - CANVAS_W / 2 + target.w / 2;
        this.x += (targetX - this.x) * 0.1;
        if (this.x < 0) this.x = 0;
        if (this.x > levelLength - CANVAS_W) this.x = levelLength - CANVAS_W;
        this.y = 0;
    }
}

// --- ИГРОВОЙ МЕНЕДЖЕР ---
const game = {
    state: STATE.MENU,
    level: 1,
    score: 0,
    lives: 3,
    player: null,
    levelGen: null,
    camera: new Camera(),
    particles: [],

    startLevel(lvl) {
        this.level = lvl;
        this.levelGen = new LevelGenerator(lvl);
        this.player = new Player(50, GROUND_Y - 50);
        this.camera.x = 0;
        this.state = STATE.PLAYING;
    },

    update(dt) {
        if (this.state !== STATE.PLAYING) return;

        this.player.update(dt, this.levelGen.platforms, this.levelGen.hidingSpots);
        this.camera.follow(this.player, this.levelGen.length);

        for (const e of this.levelGen.enemies) {
            e.update(dt, this.player, this.levelGen.platforms, this.levelGen.hidingSpots);
        }
        for (const c of this.levelGen.candies) {
            c.update(dt);
            if (!c.collected && this.player.overlaps(c)) {
                c.collected = true;
                this.score += 10;
                this.spawnParticles(c.x + 10, c.y + 10, '#FF69B4');
            }
        }

        // Проверка финиша
        if (this.levelGen.finish && this.player.overlaps(this.levelGen.finish)) {
            if (this.level >= 5) {
                this.state = STATE.WIN;
                showOverlay('🏆 ПОБЕДА! 🏆', `Ты прошёл Конфетное Королевство!<br>Очки: ${this.score}`, 'ИГРАТЬ СНОВА');
            } else {
                this.level++;
                this.startLevel(this.level);
                showOverlay(`УРОВЕНЬ ${this.level}`, 'Продолжай красться!', 'В ПУТЬ!');
                setTimeout(() => hideOverlay(), 1500);
            }
        }

        // Смерть
        if (!this.player.alive) {
            this.lives--;
            this.spawnParticles(this.player.x + 12, this.player.y + 16, '#FF0000');
            if (this.lives <= 0) {
                this.state = STATE.DEAD;
                showOverlay('💀 GAME OVER 💀', `Очки: ${this.score}<br>Уровень: ${this.level}`, 'ПОПРОБОВАТЬ СНОВА');
            } else {
                // Респавн на начале уровня
                this.player = new Player(50, GROUND_Y - 50);
                this.camera.x = 0;
            }
        }

        // Частицы
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.3 * dt;
            p.life -= dt;
            if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Очистка памяти (объекты далеко за камерой)
        // (на самом деле в процедурной генерации всё фиксировано, но оставляем для будущих расширений)
    },

    spawnParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4 - 2,
                life: 30,
                color
            });
        }
    },

    draw() {
        // Фон — градиент
        const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        grad.addColorStop(0, '#FFB6C1');
        grad.addColorStop(1, '#FF69B4');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Облака (параллакс)
        this.drawClouds();

        if (this.state === STATE.MENU) return;

        const cam = this.camera;

        // Платформы
        for (const p of this.levelGen.platforms) p.draw(ctx, cam);

        // Укрытия
        for (const h of this.levelGen.hidingSpots) h.draw(ctx, cam);

        // Конфеты
        for (const c of this.levelGen.candies) c.draw(ctx, cam);

        // Финиш
        if (this.levelGen.finish) this.levelGen.finish.draw(ctx, cam);

        // Враги
        for (const e of this.levelGen.enemies) e.draw(ctx, cam);

        // Игрок
        if (this.player) this.player.draw(ctx, cam);

        // Частицы
        for (const p of this.particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 30;
            ctx.fillRect(p.x - cam.x, p.y - cam.y, 3, 3);
        }
        ctx.globalAlpha = 1;

        // UI
        this.drawUI();
    },

    drawClouds() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        const offset = this.camera.x * 0.3;
        for (let i = 0; i < 5; i++) {
            const x = ((i * 300 - offset) % (CANVAS_W + 200)) - 100;
            const y = 50 + (i % 2) * 40;
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.arc(x + 25, y, 30, 0, Math.PI * 2);
            ctx.arc(x + 55, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }
    },

    drawUI() {
        // Панель
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(10, 10, 200, 80);
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, 200, 80);

        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 18px Courier New';
        ctx.fillText(`🍬 ${this.score}`, 25, 35);
        ctx.fillText(`❤️ ${this.lives}`, 25, 60);
        ctx.fillText(`LVL ${this.level}`, 25, 85);

        // Подсказка стелса
        if (this.player && this.player.hidden) {
            ctx.fillStyle = 'rgba(0, 200, 0, 0.8)';
            ctx.fillRect(CANVAS_W - 180, 10, 170, 30);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 14px Courier New';
            ctx.fillText('🕵️ СПРЯТАН', CANVAS_W - 170, 30);
        }
    }
};

// --- OVERLAY ---
function showOverlay(title, text, btnText) {
    overlay.classList.add('active');
    overlay.innerHTML = `
        <h1>${title}</h1>
        <p>${text}</p>
        <button id="startBtn">${btnText}</button>
    `;
    document.getElementById('startBtn').onclick = onOverlayClick;
}
function hideOverlay() {
    overlay.classList.remove('active');
}
function onOverlayClick() {
    if (game.state === STATE.MENU || game.state === STATE.DEAD) {
        game.score = 0;
        game.lives = 3;
        game.startLevel(1);
        hideOverlay();
    } else if (game.state === STATE.WIN) {
        game.score = 0;
        game.lives = 3;
        game.startLevel(1);
        hideOverlay();
    } else {
        // Продолжить после перехода уровня
        hideOverlay();
    }
}
startBtn.onclick = onOverlayClick;

// --- ГЛАВНЫЙ ЦИКЛ ---
let lastTime = performance.now();
function loop(now) {
    const rawDt = (now - lastTime) / 16.67;
    const dt = Math.min(rawDt, 3); // Защита от больших скачков
    lastTime = now;

    game.update(dt);
    game.draw();

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
