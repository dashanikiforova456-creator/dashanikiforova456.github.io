<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атлантида - Интерактивная сцена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            pointer-events: none;
            z-index: 100;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка...</div>
    <div id="info">Наведите мышь на объекты и кликайте!</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Глобальные переменные
        let scene, camera, renderer;
        let raycaster, mouse;
        let shell, key, chest;
        let interactiveObjects = [];
        let isKeyRevealed = false;
        let isChestOpened = false;
        let particles = [];
        let ambientLight, pointLight1, pointLight2;
        let waterSurface;
        
        // Инициализация сцены
        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x001e3d, 0.02);
            
            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Освещение
            setupLighting();
            
            // Создание объектов
            createWater();
            createShell();
            createKey();
            createChest();
            createEnvironment();
            
            // Скрываем загрузку
            document.getElementById('loading').style.display = 'none';
            
            // Обработчики событий
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
            
            // Анимация подлета камеры
            animateCameraFlyIn();
            
            // Запуск анимации
            animate();
        }
        
        // Настройка освещения
        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            pointLight1 = new THREE.PointLight(0x00ffff, 1, 50);
            pointLight1.position.set(5, 10, 5);
            pointLight1.castShadow = true;
            pointLight1.shadow.mapSize.width = 2048;
            pointLight1.shadow.mapSize.height = 2048;
            scene.add(pointLight1);
            
            pointLight2 = new THREE.PointLight(0xff69b4, 0.8, 50);
            pointLight2.position.set(-5, 8, -5);
            pointLight2.castShadow = true;
            scene.add(pointLight2);
        }
        
        // Создание водной поверхности
        function createWater() {
            const geometry = new THREE.PlaneGeometry(100, 100, 50, 50);
            const material = new THREE.MeshPhongMaterial({
                color: 0x006994,
                transparent: true,
                opacity: 0.6,
                shininess: 100
            });
            
            waterSurface = new THREE.Mesh(geometry, material);
            waterSurface.rotation.x = -Math.PI / 2;
            waterSurface.position.y = -2;
            waterSurface.receiveShadow = true;
            scene.add(waterSurface);
        }
        
        // Создание ракушки
        function createShell() {
            const group = new THREE.Group();
            
            // Основная часть ракушки
            const geometry = new THREE.SphereGeometry(1.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const material = new THREE.MeshPhongMaterial({
                color: 0xffd700,
                emissive: 0x000000,
                shininess: 100
            });
            
            shell = new THREE.Mesh(geometry, material);
            shell.castShadow = true;
            shell.receiveShadow = true;
            group.add(shell);
            
            // Детали ракушки
            for (let i = 0; i < 8; i++) {
                const detailGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.2, 8);
                const detailMat = new THREE.MeshPhongMaterial({ color: 0xffa500 });
                const detail = new THREE.Mesh(detailGeo, detailMat);
                detail.position.set(
                    Math.cos(i * Math.PI / 4) * 1.2,
                    0.3,
                    Math.sin(i * Math.PI / 4) * 1.2
                );
                detail.rotation.z = Math.PI / 2;
                group.add(detail);
            }
            
            group.position.set(-3, 0, 0);
            group.userData = { type: 'shell', originalEmissive: 0x000000 };
            scene.add(group);
            interactiveObjects.push(group);
        }
        
        // Создание ключа
        function createKey() {
            const group = new THREE.Group();
            
            // Головка ключа
            const headGeo = new THREE.TorusGeometry(0.3, 0.1, 16, 32);
            const headMat = new THREE.MeshPhongMaterial({
                color: 0xc0c0c0,
                emissive: 0x000000,
                shininess: 100
            });
            const head = new THREE.Mesh(headGeo, headMat);
            head.castShadow = true;
            group.add(head);
            
            // Стержень ключа
            const shaftGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8);
            const shaftMat = new THREE.MeshPhongMaterial({ color: 0xc0c0c0 });
            const shaft = new THREE.Mesh(shaftGeo, shaftMat);
            shaft.position.y = -0.75;
            shaft.castShadow = true;
            group.add(shaft);
            
            // Зубцы ключа
            for (let i = 0; i < 3; i++) {
                const toothGeo = new THREE.BoxGeometry(0.2, 0.1, 0.1);
                const toothMat = new THREE.MeshPhongMaterial({ color: 0xc0c0c0 });
                const tooth = new THREE.Mesh(toothGeo, toothMat);
                tooth.position.set(0.1, -0.5 - i * 0.3, 0);
                tooth.castShadow = true;
                group.add(tooth);
            }
            
            group.position.set(-3, -1, 0);
            group.visible = false;
            group.userData = { type: 'key', originalEmissive: 0x000000 };
            scene.add(group);
            interactiveObjects.push(group);
            key = group;
        }
        
        // Создание сундука
        function createChest() {
            const group = new THREE.Group();
            
            // Основание сундука
            const baseGeo = new THREE.BoxGeometry(2, 1, 1.5);
            const baseMat = new THREE.MeshPhongMaterial({
                color: 0x8b4513,
                emissive: 0x000000,
                shininess: 50
            });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);
            
            // Крышка сундука
            const lidGeo = new THREE.BoxGeometry(2, 0.3, 1.5);
            const lidMat = new THREE.MeshPhongMaterial({ color: 0xa0522d });
            const lid = new THREE.Mesh(lidGeo, lidMat);
            lid.position.y = 0.65;
            lid.castShadow = true;
            group.add(lid);
            
            // Металлические уголки
            const cornerGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
            const cornerMat = new THREE.MeshPhongMaterial({ color: 0xffd700 });
            
            const positions = [
                [-0.9, 0.5, -0.65], [0.9, 0.5, -0.65],
                [-0.9, 0.5, 0.65], [0.9, 0.5, 0.65]
            ];
            
            positions.forEach(pos => {
                const corner = new THREE.Mesh(cornerGeo, cornerMat);
                corner.position.set(...pos);
                group.add(corner);
            });
            
            group.position.set(3, 0, 0);
            group.userData = { type: 'chest', originalEmissive: 0x000000, lid: lid };
            scene.add(group);
            interactiveObjects.push(group);
            chest = group;
        }
        
        // Создание окружения
        function createEnvironment() {
            // Кораллы
            for (let i = 0; i < 20; i++) {
                const coralGeo = new THREE.ConeGeometry(0.3, 1, 8);
                const coralMat = new THREE.MeshPhongMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 0.8, 0.5)
                });
                const coral = new THREE.Mesh(coralGeo, coralMat);
                coral.position.set(
                    (Math.random() - 0.5) * 20,
                    -1.5,
                    (Math.random() - 0.5) * 20
                );
                coral.castShadow = true;
                scene.add(coral);
            }
            
            // Пузырьки
            for (let i = 0; i < 50; i++) {
                const bubbleGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const bubbleMat = new THREE.MeshPhongMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.3
                });
                const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
                bubble.position.set(
                    (Math.random() - 0.5) * 30,
                    Math.random() * 10 - 2,
                    (Math.random() - 0.5) * 30
                );
                bubble.userData = { speed: Math.random() * 0.02 + 0.01 };
                scene.add(bubble);
            }
        }
        
        // Анимация подлета камеры
        function animateCameraFlyIn() {
            const startPos = new THREE.Vector3(0, 20, 30);
            const endPos = new THREE.Vector3(0, 5, 15);
            const duration = 3000;
            const startTime = Date.now();
            
            function updateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Плавное движение с easing
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                camera.position.lerpVectors(startPos, endPos, easeProgress);
                camera.lookAt(0, 0, 0);
                
                if (progress < 1) {
                    requestAnimationFrame(updateCamera);
                }
            }
            
            updateCamera();
        }
        
        // Обработка движения мыши
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            checkIntersection();
        }
        
        // Проверка пересечений
        function checkIntersection() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);
            
            // Сброс подсветки всех объектов
            interactiveObjects.forEach(obj => {
                obj.traverse(child => {
                    if (child.material && child.userData.originalEmissive !== undefined) {
                        child.material.emissive.setHex(child.userData.originalEmissive);
                    }
                });
            });
            
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                
                // Подсветка объекта
                const object = intersects[0].object.parent;
                object.traverse(child => {
                    if (child.material) {
                        child.material.emissive.setHex(0x00ffff);
                    }
                });
            } else {
                document.body.style.cursor = 'default';
            }
        }
        
        // Обработка кликов
        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveObjects, true);
            
            if (intersects.length > 0) {
                const clickedObject = intersects[0].object.parent;
                const type = clickedObject.userData.type;
                
                switch(type) {
                    case 'shell':
                        revealKey();
                        break;
                    case 'key':
                        openChest();
                        break;
                    case 'chest':
                        if (isChestOpened) {
                            showFinalScene();
                        }
                        break;
                }
            }
        }
        
        // Появление ключа
        function revealKey() {
            if (!isKeyRevealed) {
                isKeyRevealed = true;
                key.visible = true;
                
                // Анимация появления ключа
                key.position.y = -1;
                const targetY = 0.5;
                const duration = 1000;
                const startTime = Date.now();
                
                function animateKey() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    key.position.y = -1 + (targetY + 1) * progress;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateKey);
                    }
                }
                
                animateKey();
                updateInfo('Теперь кликните на ключ!');
            }
        }
        
        // Открытие сундука
        function openChest() {
            if (isKeyRevealed && !isChestOpened) {
                isChestOpened = true;
                
                // Анимация открытия крышки
                const lid = chest.userData.lid;
                const duration = 1500;
                const startTime = Date.now();
                
                function animateLid() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    lid.rotation.x = -progress * Math.PI / 3;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateLid);
                    }
                }
                
                animateLid();
                updateInfo('Сундук открыт! Кликните на него для финала.');
            }
        }
        
        // Финальная сцена
        function showFinalScene() {
            updateInfo('🎉 Поздравляем! Вы нашли сокровища Атлантиды! 🎉');
            
            // Изменение цвета освещения
            const targetColor = new THREE.Color(0xff69b4);
            const duration = 2000;
            const startTime = Date.now();
            
            function animateLighting() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                ambientLight.color.lerp(targetColor, progress * 0.1);
                pointLight1.color.lerp(new THREE.Color(0xff1493), progress * 0.1);
                pointLight2.color.lerp(new THREE.Color(0xff69b4), progress * 0.1);
                
                if (progress < 1) {
                    requestAnimationFrame(animateLighting);
                }
            }
            
            animateLighting();
            
            // Перемещение камеры к сундуку
            const targetPos = new THREE.Vector3(3, 2, 5);
            const camDuration = 2000;
            const camStartTime = Date.now();
            
            function animateCamera() {
                const elapsed = Date.now() - camStartTime;
                const progress = Math.min(elapsed / camDuration, 1);
                
                camera.position.lerp(targetPos, progress * 0.05);
                camera.lookAt(chest.position);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            
            animateCamera();
            
            // Запуск салюта
            setTimeout(createFireworks, 1000);
        }
        
        // Создание салюта из частиц
        function createFireworks() {
            for (let i = 0; i < 100; i++) {
                const particleGeo = new THREE.SphereGeometry(0.1, 8, 8);
                const particleMat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                    transparent: true
                });
                
                const particle = new THREE.Mesh(particleGeo, particleMat);
                particle.position.copy(chest.position);
                particle.position.y += 2;
                
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        Math.random() * 0.3 + 0.1,
                        (Math.random() - 0.5) * 0.3
                    ),
                    life: 1
                };
                
                scene.add(particle);
                particles.push(particle);
            }
        }
        
        // Обновление информации
        function updateInfo(text) {
            document.getElementById('info').textContent = text;
        }
        
        // Обработка изменения размера окна
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            
            // Анимация пузырьков
            scene.children.forEach(child => {
                if (child.userData && child.userData.speed) {
                    child.position.y += child.userData.speed;
                    if (child.position.y > 10) {
                        child.position.y = -2;
                    }
                }
            });
            
            // Анимация частиц салюта
            particles.forEach((particle, index) => {
                if (particle.userData.life > 0) {
                    particle.position.add(particle.userData.velocity);
                    particle.userData.velocity.y -= 0.01; // гравитация
                    particle.userData.life -= 0.01;
                    particle.material.opacity = particle.userData.life;
                    
                    if (particle.userData.life <= 0) {
                        scene.remove(particle);
                        particles.splice(index, 1);
                    }
                }
            });
            
            // Легкое покачивание объектов
            const time = Date.now() * 0.001;
            if (shell) shell.rotation.y = Math.sin(time) * 0.1;
            if (key && key.visible) key.rotation.y = Math.sin(time * 2) * 0.2;
            
            renderer.render(scene, camera);
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
